description: 'Novig is a peer-to-peer sports prediction and trading platform marketed as "America''s
  #1 Sports Trading App," operating as a betting exchange rather than a traditional sportsbook. Users
  can set their own odds or accept existing lines across two modes: free-to-play with Novig Coins and
  real-money trading with Novig Cash. The consumer product is delivered as iOS and Android apps and is
  available in 35+ U.S. states. Backed by Forerunner Ventures, Multicoin Capital, and Pantera Capital.
  As of this enrichment pass Novig exposes no public API, developer portal, SDKs, or machine-readable
  discovery surface.'
